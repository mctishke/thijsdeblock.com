<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  // Adressen van de vorige site (tot 2026) wijzen naar hun plek op de nieuwe pagina.
  (function () {
    var p = location.pathname.replace(/\/+$/, "").toLowerCase();
    var naar = {
      "/about": "/#over",
      "/contact": "/#contact",
      "/commercial-work": "/#werk",
      "/personal-projects": "/#meer"
    }[p];
    if (!naar && p.indexOf("/personal-projects/") === 0) naar = "/#meer";
    if (naar) location.replace(naar);
  })();
</script>

  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #d4bb93;

  h1 { font: italic 800 64px/0.9 "Barlow Condensed", sans-serif; text-transform: uppercase; margin: 0 0 16px; }

</style>
